[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartrouter"
version = "0.1.0"
description = "Pluggable, capability-aware model router: pick the cheapest model that can handle each request, escalate only when needed."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sainag Shetty" }]
keywords = ["llm", "router", "openrouter", "ollama", "model-routing", "cost-optimization"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]
dependencies = [
    "pydantic>=2",
    "httpx>=0.24",
    "scikit-learn>=1.1",
    "numpy>=1.21",
    "pyyaml>=6",
    "joblib>=1.2",
]

[project.optional-dependencies]
# Higher-quality embeddings via a local sentence-transformer (pulls in torch).
local-embed = ["sentence-transformers>=2.2"]
# Use lm-sys/RouteLLM pretrained checkpoints as the classifier backend.
routellm = ["routellm>=0.2"]
# Tracing only (not the LangChain framework) per stack conventions.
langfuse = ["langfuse>=2"]
# Run the shared router as an HTTP service (also powers `smartrouter ui`,
# which needs ruamel.yaml to save config edits without clobbering comments).
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "ruamel.yaml>=0.17"]
dev = ["pytest>=7", "fastapi>=0.110", "uvicorn>=0.27", "ruamel.yaml>=0.17"]

[project.scripts]
smartrouter = "smartrouter.cli:main"

[project.urls]
Homepage = "https://github.com/sainagshetty/smart-router"

[tool.hatch.build.targets.wheel]
packages = ["src/smartrouter"]

[tool.hatch.build.targets.wheel.force-include]
"src/smartrouter/data" = "smartrouter/data"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
filterwarnings = [
    # macOS Accelerate emits spurious matmul RuntimeWarnings from BLAS.
    "ignore::RuntimeWarning",
]
