# Example smartrouter config: local Ollama -> cheap cloud -> frontier.
providers:
  ollama:
    type: ollama
    base_url: http://localhost:11434/v1
    local: true
  openrouter:
    type: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

tiers:
  - { name: local,    min_score: 0.0 }
  - { name: cheap,    min_score: 0.40 }
  - { name: frontier, min_score: 0.75 }

models:
  - id: "dolphin3:8b"
    provider: ollama
    tier: local
    # 4096, not the model's architectural 32768: Ollama allocates num_ctx, and it
    # defaults to 4096 regardless of what the model supports. Declaring more than
    # Ollama serves means the gate admits prompts that then get silently
    # truncated — the model would answer on a clipped conversation with nothing
    # surfacing the loss. (Measured 2026-07-31: nothing had actually overflowed
    # yet, so this was latent rather than live.)
    #
    # Raising it was measured and rejected. Allocating 32768 is nearly free
    # (+0.8GB, no latency change, stays 100% GPU), but *using* long context is
    # not: prefill runs ~6.25 ms/token on the M4, so a 10k-token transcript costs
    # ~65s against ~1-4s in the cloud. Of the deep-turn traffic that would have
    # become local-eligible, 68% would have taken over 30s — to save ~$0.30.
    # Local stays for short prompts, where it is genuinely fast (~0.4s generation).
    context_window: 4096
    # vision:false so image requests gate straight to the cloud vision models.
    # (Ollama's OpenAI endpoint won't fetch image URLs; it needs base64. Flip to
    # true only if your callers send base64 image data.)
    capabilities: {}
  - id: "xiaomi/mimo-v2.5"
    provider: openrouter
    tier: cheap
    cost_per_1k: 0.0002
    context_window: 1048576
    capabilities: { vision: true, tools: true, json: true }
  - id: "google/gemini-3.1-flash-lite"
    provider: openrouter
    tier: frontier
    cost_per_1k: 0.0009
    context_window: 1048576
    capabilities: { vision: true, tools: true, json: true }

classifier:
  kind: embedding
  embedding_backend: hashing   # no torch; swap to sentence-transformer with the local-embed extra

policy:
  fallback: down
  allow_overrides: true
  default_tier: cheap

logging:
  enabled: true
  db_path: smartrouter.db
  # Retain raw prompts + responses: this corpus trains the classifier head and
  # eventually distills a personal LLM. All traffic here is Sai's own; sensitive
  # services tag rows with `sensitive: true` per request so exports can filter.
  # (The library default stays false — this is a personal-deployment choice.)
  log_raw: true
