# Example smartrouter config: local Ollama -> cheap cloud -> frontier.
providers:
  ollama:
    type: ollama
    base_url: http://localhost:11434/v1
    local: true
  openrouter:
    type: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

tiers:
  - { name: local,    min_score: 0.0 }
  - { name: cheap,    min_score: 0.40 }
  - { name: frontier, min_score: 0.75 }

models:
  - id: "gemma3n:e4b"
    provider: ollama
    tier: local
    context_window: 8192
    # vision:false so image requests gate straight to the cloud vision models.
    # (Ollama's OpenAI endpoint won't fetch image URLs; it needs base64. Flip to
    # true only if your callers send base64 image data.)
    capabilities: {}
  - id: "xiaomi/mimo-v2.5"
    provider: openrouter
    tier: cheap
    cost_per_1k: 0.0002
    context_window: 1048576
    capabilities: { vision: true, tools: true, json: true }
  - id: "google/gemini-3.1-flash-lite"
    provider: openrouter
    tier: frontier
    cost_per_1k: 0.0009
    context_window: 1048576
    capabilities: { vision: true, tools: true, json: true }

classifier:
  kind: embedding
  embedding_backend: hashing   # no torch; swap to sentence-transformer with the local-embed extra

policy:
  fallback: down
  allow_overrides: true
  default_tier: cheap

logging:
  enabled: true
  db_path: smartrouter.db
  log_raw: false               # set true to retain prompts for distillation
