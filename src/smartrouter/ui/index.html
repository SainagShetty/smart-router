<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartRouter Config</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/alpinejs" defer></script>
</head>
<body class="bg-gray-100 p-8">
    <div x-data="routerConfig()" x-init="init()" class="max-w-5xl mx-auto bg-white p-6 rounded shadow">
        <h1 class="text-2xl font-bold mb-1">Router Configuration</h1>
        <p class="text-sm text-gray-500 mb-4">Editing tiers and models. The running router process must be restarted after saving for changes to take effect.</p>

        <div x-show="message"
             x-transition
             class="mb-4 p-3 rounded text-sm font-medium"
             :class="messageType === 'error' ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-green-50 text-green-700 border border-green-200'">
            <span x-text="message"></span>
            <button @click="message = ''" class="float-right font-bold">&times;</button>
        </div>

        <div class="flex gap-1 border-b mb-6">
            <template x-for="tab in ['tiers', 'models', 'stats']" :key="tab">
                <button @click="setTab(tab)"
                        class="px-4 py-2 text-sm font-bold capitalize border-b-2 -mb-px"
                        :class="activeTab === tab ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'"
                        x-text="tab"></button>
            </template>
        </div>

        <div x-show="activeTab === 'tiers'">
            <h2 class="font-bold text-lg mb-2">Tiers</h2>
            <div class="space-y-3 mb-6">
                <template x-for="tier in config.tiers" :key="tier.name">
                    <div class="border p-3 rounded bg-gray-50 flex items-center gap-4">
                        <span class="font-mono font-bold w-28" x-text="tier.name"></span>
                        <label class="flex items-center gap-2 text-sm">Threshold
                            <input type="number" step="0.01" min="0" max="1" x-model.number="tier.min_score" class="border p-1 w-24">
                        </label>
                    </div>
                </template>
            </div>
            <button @click="saveConfig" class="bg-blue-500 text-white px-4 py-2 rounded font-bold">Save Changes</button>
        </div>

        <div x-show="activeTab === 'models'">
            <h2 class="font-bold text-lg mb-2">Models</h2>
            <div class="overflow-x-auto mb-4">
                <table class="w-full text-sm border-collapse">
                    <thead>
                        <tr class="text-left border-b bg-gray-50">
                            <th class="p-2">ID</th>
                            <th class="p-2">Provider</th>
                            <th class="p-2">Tier</th>
                            <th class="p-2">Cost / 1k</th>
                            <th class="p-2">Context window</th>
                            <th class="p-2 text-center">Vision</th>
                            <th class="p-2 text-center">Tools</th>
                            <th class="p-2 text-center">JSON</th>
                            <th class="p-2"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-for="(model, index) in models" :key="index">
                            <tr class="border-b">
                                <td class="p-2"><input type="text" x-model="model.id" class="border p-1 w-40 font-mono"></td>
                                <td class="p-2">
                                    <select x-model="model.provider" class="border p-1">
                                        <template x-for="name in providerNames" :key="name">
                                            <option :value="name" x-text="name"></option>
                                        </template>
                                    </select>
                                </td>
                                <td class="p-2">
                                    <select x-model="model.tier" class="border p-1">
                                        <template x-for="name in tierNames" :key="name">
                                            <option :value="name" x-text="name"></option>
                                        </template>
                                    </select>
                                </td>
                                <td class="p-2"><input type="number" step="0.0001" min="0" x-model.number="model.cost_per_1k" class="border p-1 w-24"></td>
                                <td class="p-2"><input type="number" step="1" min="1" x-model.number="model.context_window" class="border p-1 w-28"></td>
                                <td class="p-2 text-center"><input type="checkbox" x-model="model.vision"></td>
                                <td class="p-2 text-center"><input type="checkbox" x-model="model.tools"></td>
                                <td class="p-2 text-center"><input type="checkbox" x-model="model.json_mode"></td>
                                <td class="p-2"><button @click="removeModel(index)" class="text-red-600 font-bold px-2">&#10005;</button></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            <button @click="addModel" class="mb-6 bg-gray-200 hover:bg-gray-300 px-3 py-1.5 rounded text-sm font-bold">+ Add model</button>
            <div>
                <button @click="saveConfig" class="bg-blue-500 text-white px-4 py-2 rounded font-bold">Save Changes</button>
            </div>
        </div>

        <div x-show="activeTab === 'stats'">
            <div class="flex items-center justify-between mb-2">
                <h2 class="font-bold text-lg">Decision log</h2>
                <button @click="loadStats" class="text-sm text-blue-600 hover:underline" :disabled="statsLoading">
                    <span x-text="statsLoading ? 'Refreshing…' : 'Refresh'"></span>
                </button>
            </div>

            <template x-if="stats && stats.logging === 'disabled'">
                <p class="text-sm text-gray-500">Logging is disabled in this config (<code class="font-mono">logging.enabled: false</code>) — nothing to show.</p>
            </template>

            <template x-if="stats && stats.logging !== 'disabled'">
                <div class="space-y-6">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <div class="border rounded p-3 bg-gray-50">
                            <div class="text-xs text-gray-500">Total decisions</div>
                            <div class="text-2xl font-bold" x-text="stats.total"></div>
                        </div>
                        <div class="border rounded p-3 bg-gray-50">
                            <div class="text-xs text-gray-500">Labeled</div>
                            <div class="text-2xl font-bold" x-text="stats.labeled"></div>
                        </div>
                        <div class="border rounded p-3 bg-gray-50">
                            <div class="text-xs text-gray-500">On-device</div>
                            <div class="text-2xl font-bold" x-text="stats.savings.on_device_pct + '%'"></div>
                        </div>
                        <div class="border rounded p-3 bg-gray-50">
                            <div class="text-xs text-gray-500">Observed spend</div>
                            <div class="text-2xl font-bold">$<span x-text="stats.savings.total_cost"></span></div>
                        </div>
                    </div>

                    <div>
                        <h3 class="font-bold text-sm mb-2 text-gray-600">By tier</h3>
                        <div class="space-y-2">
                            <template x-for="tier in tierNames" :key="tier">
                                <div class="flex items-center gap-3 text-sm">
                                    <span class="font-mono w-24" x-text="tier"></span>
                                    <div class="flex-1 bg-gray-100 rounded h-4 overflow-hidden">
                                        <div class="bg-blue-400 h-4" :style="`width: ${tierPct(tier)}%`"></div>
                                    </div>
                                    <span class="w-16 text-right text-gray-600" x-text="(stats.by_tier[tier] || 0)"></span>
                                </div>
                            </template>
                        </div>
                    </div>

                    <p class="text-xs text-gray-400">
                        <span x-text="stats.savings.free"></span> of <span x-text="stats.savings.on_device"></span> on-device decisions cost $0.
                        Labeled rows are what a head retrain (<code class="font-mono">train/train_head.py</code>) trains on.
                    </p>
                </div>
            </template>

            <p x-show="!stats && !statsLoading" class="text-sm text-gray-500">No stats loaded yet.</p>
        </div>
    </div>

    <script>
        function routerConfig() {
            return {
                config: { tiers: [], models: [], providers: {} },
                models: [],
                activeTab: 'tiers',
                message: '',
                messageType: 'success',
                stats: null,
                statsLoading: false,
                async init() {
                    const res = await fetch('/api/config');
                    this.config = await res.json();
                    this.models = (this.config.models || []).map((m, i) => ({
                        orig_index: i,
                        id: m.id,
                        provider: m.provider,
                        tier: m.tier,
                        cost_per_1k: m.cost_per_1k ?? 0,
                        context_window: m.context_window ?? 8192,
                        vision: !!(m.capabilities && m.capabilities.vision),
                        tools: !!(m.capabilities && m.capabilities.tools),
                        json_mode: !!(m.capabilities && m.capabilities.json),
                    }));
                },
                setTab(tab) {
                    this.activeTab = tab;
                    if (tab === 'stats' && !this.stats) this.loadStats();
                },
                async loadStats() {
                    this.statsLoading = true;
                    try {
                        const res = await fetch('/api/stats');
                        this.stats = await res.json();
                        if (!res.ok) {
                            this.message = this.stats.detail || 'Failed to load stats';
                            this.messageType = 'error';
                        }
                    } finally {
                        this.statsLoading = false;
                    }
                },
                tierPct(tier) {
                    if (!this.stats || !this.stats.total) return 0;
                    return Math.round(100 * (this.stats.by_tier[tier] || 0) / this.stats.total);
                },
                get providerNames() {
                    return Object.keys(this.config.providers || {});
                },
                get tierNames() {
                    return (this.config.tiers || []).map(t => t.name);
                },
                addModel() {
                    this.models.push({
                        orig_index: null,
                        id: '',
                        provider: this.providerNames[0] || '',
                        tier: this.tierNames[0] || '',
                        cost_per_1k: 0,
                        context_window: 8192,
                        vision: false,
                        tools: false,
                        json_mode: false,
                    });
                },
                removeModel(index) {
                    this.models.splice(index, 1);
                },
                async saveConfig() {
                    const tiers = this.config.tiers.map(t => ({name: t.name, min_score: t.min_score}));
                    const models = this.models.map(m => ({
                        id: m.id,
                        provider: m.provider,
                        tier: m.tier,
                        cost_per_1k: Number(m.cost_per_1k),
                        context_window: Number(m.context_window),
                        vision: m.vision,
                        tools: m.tools,
                        json_mode: m.json_mode,
                        orig_index: m.orig_index,
                    }));
                    const response = await fetch('/api/config', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({tiers, models})
                    });
                    const body = await response.json();
                    if (response.ok) {
                        this.message = `Saved. ${body.note}`;
                        this.messageType = 'success';
                        await this.init();
                    } else {
                        this.message = `Error saving: ${body.detail || response.statusText}`;
                        this.messageType = 'error';
                    }
                }
            }
        }
    </script>
</body>
</html>
